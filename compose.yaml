services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: idemio
      POSTGRES_PASSWORD: idemio
      POSTGRES_DB: idemio
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idemio -d idemio"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: idemio
      DB_PASSWORD: idemio
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      ADMIN_USERS: idemio
    ports:
      - "6433:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:19092
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: idemio
      MINIO_ROOT_PASSWORD: idemio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - miniodata:/data

  # Everything below is the `observe` profile: the deployed binaries plus the monitoring
  # stack they are scraped by. `docker compose up -d --wait` leaves it alone, because the
  # test suite talks to Postgres, the broker and object storage directly and needs none of it.
  fakedownstream:
    profiles: ["observe"]
    build: .
    entrypoint: ["/usr/local/bin/fakedownstream"]
    command: ["-ledger", "/tmp/ledger.jsonl", "-data-addr", "0.0.0.0:8081", "-control-addr", "0.0.0.0:8082"]
    ports:
      - "8081:8081"
      - "8082:8082"

  idemio:
    profiles: ["observe"]
    build: .
    environment:
      IDEMIO_DATABASE_URL: postgres://idemio:idemio@postgres:5432/idemio
      IDEMIO_DOWNSTREAM_BASE_URL: http://fakedownstream:8081
      IDEMIO_AUTH_MODE: trusted_header
      IDEMIO_LISTEN_ADDR: 0.0.0.0:8080
      IDEMIO_MANIFEST_DIR: /etc/idemio/manifests
      IDEMIO_DOWNSTREAM_TIMEOUT_MS: 2000
      IDEMIO_RECONCILE_STALE_AFTER: 30s
      IDEMIO_RECONCILE_INTERVAL: 5s
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  reconciler:
    profiles: ["observe"]
    build: .
    entrypoint: ["/usr/local/bin/reconciler"]
    environment:
      IDEMIO_DATABASE_URL: postgres://idemio:idemio@postgres:5432/idemio
      IDEMIO_DOWNSTREAM_BASE_URL: http://fakedownstream:8081
      IDEMIO_AUTH_MODE: trusted_header
      IDEMIO_METRICS_ADDR: 0.0.0.0:9090
      IDEMIO_MANIFEST_DIR: /etc/idemio/manifests
      IDEMIO_DOWNSTREAM_TIMEOUT_MS: 2000
      IDEMIO_RECONCILE_STALE_AFTER: 30s
      IDEMIO_RECONCILE_INTERVAL: 5s
    restart: unless-stopped
    depends_on:
      idemio:
        condition: service_started

  alertsink:
    profiles: ["observe"]
    build: .
    entrypoint: ["/usr/local/bin/alertsink"]
    command: ["-addr", "0.0.0.0:9098"]
    ports:
      - "9098:9098"

  prometheus:
    profiles: ["observe"]
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    volumes:
      - ./deploy:/etc/prometheus:ro

  alertmanager:
    profiles: ["observe"]
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    profiles: ["observe"]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  miniodata:
