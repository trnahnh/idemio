services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: idemio
      POSTGRES_PASSWORD: idemio
      POSTGRES_DB: idemio
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idemio -d idemio"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
