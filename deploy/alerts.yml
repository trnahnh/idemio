groups:
  - name: idemio-correctness
    rules:
      - alert: IdemioIndeterminateKeys
        expr: idemio_indeterminate_keys > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} writes have an outcome nobody knows"
          description: >-
            An indeterminate key may or may not have executed downstream. It is terminal and
            not re-claimable, so the agent has stopped and a human must determine the truth.
            The correct standing value is zero. Follow "Resolving an indeterminate key" in
            DEPLOYMENT_CHECKLIST.md. Do not guess: failed means provably no side effect.

      - alert: IdemioStalePendingKeys
        expr: idemio_oldest_pending_age_seconds > idemio_reconcile_stale_after_seconds
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Oldest pending key is {{ $value }}s old, past the configured stale window"
          description: >-
            The reconciler is not keeping up, or is not running. Pending keys past this age
            should have been probed and resolved. The threshold is read from
            idemio_reconcile_stale_after_seconds rather than restated here, so it cannot
            drift from the running configuration.

      - alert: IdemioProbeFailing
        expr: rate(idemio_probe_failures_total[10m]) > 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Probe for {{ $labels.resource_type }} is unreachable"
          description: >-
            Crash recovery for this write path is degrading toward manual. Probe failures
            leave keys pending rather than escalating them, so expect
            IdemioStalePendingKeys to follow if this persists. One incident, not two.

      - alert: IdemioEscalatingToIndeterminate
        expr: increase(idemio_reconciled_total{outcome="indeterminate"}[1h]) > 0
        labels:
          severity: warn
        annotations:
          summary: "Reconciler escalated {{ $value }} keys to indeterminate in the last hour"
          description: >-
            The reconciler could not determine whether these writes landed. Each one becomes
            manual work. Investigate before the standing count triggers IdemioIndeterminateKeys.

  - name: idemio-capacity
    rules:
      - alert: IdemioPartitionHeadroomLow
        expr: idemio_partition_headroom_seconds < 4 * 7 * 24 * 3600
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.table }} has under four weeks of partitions"
          description: >-
            A missing range partition is a hard write-path outage, not a degradation. Note
            that cmd/idemio refuses to boot below two weeks, so a deploy will start failing
            before writes do.

      - alert: IdemioClaimCollisionsHigh
        expr: >-
          rate(idemio_claim_collisions_total[30m])
            / clamp_min(rate(idemio_writes_total[30m]), 0.001) > 0.01
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Claim collisions above 1% of writes"
          description: >-
            One of the two ADR-0010 triggers for consistent-hash routing. This is a signal to
            read, not to act on immediately; the ADR asks for sustained history before
            routing is adopted.

      - alert: IdemioReclaimTailHigh
        expr: histogram_quantile(0.99, rate(idemio_reclaim_attempts_bucket[1h])) > 5
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "p99 re-claim attempt is {{ $value }}"
          description: >-
            Individual keys are being re-claimed repeatedly, which suggests a flapping
            downstream rather than ordinary retry traffic. The tail is the signal here; a
            high overall rate with a low tail is normal.

  - name: idemio-contract
    rules:
      - alert: IdemioHashMismatches
        expr: rate(idemio_hash_mismatches_total[15m]) > 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Agent {{ $labels.agent_id }} is reusing keys across different bodies"
          description: >-
            A client bug, never silently executed. Hashing is canonical per ADR-0003, so a
            legitimate retry that re-serialises its JSON will not trigger this.

  - name: idemio-conflict-detection
    rules:
      - alert: IdemioConflictRejectionsSpiking
        expr: >-
          rate(idemio_conflicts_total{resolution="rejected"}[15m])
            / clamp_min(rate(idemio_writes_total[15m]), 0.001) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Over 5% of writes to {{ $labels.resource_type }} are being rejected as conflicts"
          description: >-
            A wrong or over-broad manifest surfaces as mass rejection, which is an
            availability incident rather than a correctness one. Check whether enforcement
            was enabled for this resource_type recently, and compare against the observed
            rate that shadow mode produced before the change. Rolling back is a manifest
            edit, not a deploy.

      - alert: IdemioManifestReloadFailing
        expr: increase(idemio_manifest_reload_failures_total[30m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Manifest reloads are being rejected"
          description: >-
            The process is still serving the last manifest that validated, so nothing is
            broken right now. What is broken is that manifest changes have stopped taking
            effect, silently, which means an operator believes they have changed conflict
            semantics and has not. Read the validation errors in the process log.

      - alert: IdemioSerializationTimeouts
        expr: rate(idemio_serialization_waits_total{outcome="timeout"}[15m]) > 0
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Same-agent writes are waiting out their serialization budget"
          description: >-
            One agent is writing to a single resource faster than the downstream can absorb.
            Each timeout is a retryable 503 with nothing written, so this is a throughput
            signal, not a correctness one. Compare with idemio_lock_wait_seconds.

      - alert: IdemioLockWaitHigh
        expr: histogram_quantile(0.99, rate(idemio_lock_wait_seconds_bucket[30m])) > 0.05
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "p99 resource lock wait is {{ $value }}s"
          description: >-
            One of the two ADR-0010 triggers for consistent-hash routing, at 50ms. This is a
            signal to read rather than to act on: the ADR asks for sustained history at or
            above 70% of target throughput before routing is adopted.

  - name: idemio-pipelines
    rules:
      - alert: IdemioRetentionFallingBehind
        expr: idemio_retention_lag_seconds > 7 * 24 * 3600
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.table }} holds data a week past its hot window"
          description: >-
            The retention sweep is rate-matched to ingest. If it loses, the hot table grows
            without bound and no other signal says so until the disk does. For
            idempotency_keys this is a batched DELETE that can be given more budget; for the
            range-partitioned tables it usually means the archive export is failing.

      - alert: IdemioRelayLagHigh
        expr: idemio_relay_lag_seconds > 60
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Outbox relay is {{ $value }}s behind"
          description: >-
            The Phase 1 exit criterion is under one minute at steady state. The relay is off
            the write path by construction, so this never escalates to a write-path incident;
            it degrades analytics and replay. Check idemio_relay_failures_total and the broker.

      - alert: IdemioPartitionMaintenanceStopped
        expr: >-
          increase(idemio_partitions_created_total[7d]) == 0
            and idemio_partition_headroom_seconds < 6 * 7 * 24 * 3600
        for: 6h
        labels:
          severity: warn
        annotations:
          summary: "No partitions created for {{ $labels.table }} while headroom is shrinking"
          description: >-
            Headroom alone falls slowly and pages late. This fires while there is still time
            to act: the maintainer has created nothing in a week and the horizon is closing.
            IdemioPartitionHeadroomLow is the backstop, not the warning.

  - name: idemio-results
    rules:
      - alert: IdemioOffloadFallbacks
        expr: increase(idemio_offload_fallbacks_total[30m]) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Oversized results are being stored inline because object storage refused them"
          description: >-
            Nothing is lost: the cap is a performance guard and falling back to inline is the
            designed degradation (ADR-0018). But it means object storage is unhealthy, and
            that the row-width protection ADR-0009 relies on for the idempotency_keys
            retention sweep has silently stopped applying. Fix storage before the sweep falls
            behind.

      - alert: IdemioResultFetchFailures
        expr: rate(idemio_result_fetch_failures_total[15m]) > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Replays cannot read offloaded results"
          description: >-
            These writes completed and their outcomes are recorded; only the stored bodies
            are unreadable, and the response is a 500 that clients retry safely. Check object
            storage reachability from the API replicas specifically, since the reconciler may
            reach it while they do not.
